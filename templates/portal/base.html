<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Portal del paciente{% endblock %}</title>
<style>
:root{--brand:#0F766E;--brand-dark:#115E59;--bg:#F6F5F2;--ink:#1C1917;--muted:#78716C;--border:#E7E2D9;--ok:#15803D;--ok-bg:#E5F5EA;--warn:#B45309;--warn-bg:#FDF3E3}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
.top{background:var(--brand);color:#fff;padding:22px 16px;text-align:center;border-radius:0 0 20px 20px;margin-bottom:20px}
.top h1{margin:0;font-size:20px}
.top p{margin:4px 0 0;opacity:.9;font-size:14px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card h3{margin:0 0 10px;font-size:16px}
.btn{display:inline-block;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:13px 22px;font-size:16px;text-decoration:none;cursor:pointer;width:100%;text-align:center;font-weight:600}
.btn:hover{background:var(--brand-dark);color:#fff}
.btn-sec{display:inline-block;background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:12px;padding:11px 18px;font-size:15px;text-decoration:none;text-align:center}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.sub{color:var(--muted);font-size:13px}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.alert.ok{background:var(--ok-bg);color:#14532D;border:1px solid #BFE6C9}
.alert.bad{background:#FBE7EB;color:#881337;border:1px solid #F5C2CE}
.nav{display:flex;gap:8px;margin-bottom:16px}
.nav a{flex:1}
.doc-body p,.doc-body li{line-height:1.65;font-size:15px}
.doc-body ul,.doc-body ol{margin:8px 0 8px 20px}
input[type=text]{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:16px}
</style>
</head>
<body>
<div class="top">
  <h1>{{ clinic.name|default:"Mi Clínica" }}</h1>
  <p>Portal del paciente</p>
</div>
<div class="wrap">
  {% block content %}{% endblock %}
  <p class="sub" style="text-align:center;margin-top:24px">Este enlace es personal e intransferible.</p>
</div>
</body>
</html>

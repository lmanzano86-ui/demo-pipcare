<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificación en dos pasos — SecurePIP</title>
<style>
body{margin:0;font-family:Helvetica,Arial,sans-serif;background:linear-gradient(135deg,#0F2E2B,#0F766E);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:12px;padding:32px;max-width:380px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
h2{color:#0F2E2B;margin:0 0 8px}
p{color:#555;font-size:14px}
input{font-size:26px;letter-spacing:8px;text-align:center;padding:10px;width:220px;border:2px solid #E7E2D9;border-radius:8px;margin:16px 0}
button{background:#0F766E;color:#fff;border:0;border-radius:8px;padding:12px 28px;font-size:16px;cursor:pointer;width:100%}
.msg{padding:10px;border-radius:6px;font-size:14px;margin-bottom:12px;background:#FDECEA;color:#9B1C1C}
a{color:#0F766E;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h2>Verificación en dos pasos</h2>
<p>Abra su app de autenticación e ingrese el código de 6 dígitos.</p>
{% if messages %}{% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}{% endif %}
<form method="post">{% csrf_token %}
<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" autofocus><br>
<button type="submit">Verificar</button>
</form>
<p style="margin-top:16px"><a href="/accounts/logout/">Salir</a></p>
</div>
</body>
</html>

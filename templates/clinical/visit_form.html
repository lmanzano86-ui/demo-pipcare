{% extends "base.html" %}
{% block title %}Nueva visita{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Nueva visita</h1>
    <p class="sub">{{ accident.patient }} · caso del {{ accident.date }}</p>
  </div>
</div>
<div class="card">
  <form method="post">{% csrf_token %}
    <div class="form-grid">{{ form.as_p }}</div>
    <div class="form-actions">
      <button type="submit">Guardar y crear SOAP</button>
      <a class="btn-sec" href="{% url 'accident_detail' accident.pk %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}

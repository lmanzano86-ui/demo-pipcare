services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: clinicas
      POSTGRES_USER: clinicas
      POSTGRES_PASSWORD: clinicas
    volumes:
      - pgdata:/var/lib/postgresql/data
    # R-08: puerto de BD NO publicado (solo red interna de Docker).
    # Solo para depuración local, descomentar:
    # ports:
    #   - "5433:5432"

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cambiar-en-produccion}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://*.localhost:8000}
      DATABASE_URL: postgresql://clinicas:clinicas@db:5432/clinicas
    depends_on:
      - db

volumes:
  pgdata:
